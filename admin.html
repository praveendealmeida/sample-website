<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Admin — USDT Strategy</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .filter-tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-tabs button { border:1px solid var(--border-strong); background:var(--surface); color:var(--text2); font-weight:700; font-size:13px; padding:8px 14px; border-radius:9px; cursor:pointer; font-family:inherit; }
  .filter-tabs button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .admin-form { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; max-width:640px; }
  .admin-form label { font-size:13px; font-weight:700; color:var(--text2); }
  .admin-form input, .admin-form select, .admin-form textarea { width:100%; padding:11px 13px; border:1.5px solid var(--border-strong); border-radius:9px; font-size:14px; font-family:inherit; }
  .admin-form .full { grid-column:1 / -1; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  @media (max-width:560px){ .admin-form { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar" id="sidebar">
    <a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></span><span class="brand-text">USDT<span>Admin</span></span></a>
    <nav class="app-nav" id="adminNav">
      <button class="nav-item active" data-section="dashboard">Dashboard</button>
      <button class="nav-item" data-section="plans">Plans</button>
      <button class="nav-item" data-section="users">Users</button>
      <button class="nav-item" data-section="deposits">Deposits</button>
      <button class="nav-item" data-section="deposit-settings">Deposit Settings</button>
      <button class="nav-item" data-section="withdrawals">Withdrawals</button>
      <button class="nav-item" data-section="kyc">KYC</button>
      <button class="nav-item" data-section="referrals">Referrals</button>
      <button class="nav-item" data-section="settings">Settings</button>
    </nav>
    <div class="sidebar-foot"><a href="index.html">← Back to site</a><button id="logoutBtn" class="btn btn-ghost">Logout</button></div>
  </aside>
  <main class="app-main">
    <header class="app-topbar"><button class="menu-toggle" id="menuToggle">☰</button><h1 id="pageTitle">Dashboard</h1><div class="topbar-right"><span class="top-user">Administrator</span></div></header>
    <div class="app-content">
      <div id="authView" class="auth-view"><div class="auth-card"><h2>Admin Login</h2><p>Sign in to manage the platform.</p><form id="adminLoginForm"><label>Username</label><input type="text" id="adminUser" required><label>Password</label><input type="password" id="adminPass" required><button class="btn btn-primary" type="submit">Login</button><p class="form-error" id="adminLoginError"></p></form></div></div>
      <div id="adminView" hidden><div id="content"></div></div>
    </div>
  </main>
</div>
<script src="admin.js"></script>
</body>
</html>
